<form class="row g-3" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group col-md-8 position-relative py-2 px-4 text-bg-secondary border border-secondary rounded-pill">
        <div class="center-titulo">
            <h1>SISCON</h1>
        </div>
        <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="nombreUsuario" formControlName="nombreUsuario">
        <!-- Mostrar mensaje de error si el campo es inválido -->
        <div *ngIf="loginForm.get('nombreUsuario')?.hasError('required') && loginForm.get('nombreUsuario')?.touched" class="error-message">
            El nombre de usuario es obligatorio.
        </div>
    </div>
    <div class="form-group col-md-8 position-relative py-2 px-4 text-bg-secondary border border-secondary rounded-pill">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password"  class="form-control" id="password" formControlName="password">
        <div *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="error-message">
            La Contraseña es obligatoria.
        </div>
    </div>
    <button type="submit" class="btn btn-primary d-grid gap-2 col-6 mx-auto btn-lg" [disabled]="!loginForm.valid">Iniciar Sesión</button>
</form>
<div *ngIf="loginSuccess" class="succes-message">
</div>
